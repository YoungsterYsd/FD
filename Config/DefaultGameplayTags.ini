; FD 项目 GameplayTags 配置文件
; Native Tags 在 FDGameplayTags.cpp 中定义
; 蓝图 Tag 在此文件中添加

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
ClearInvalidTags=False
AllowEditorTagUnloading=True
AllowGameTagUnloading=False
FastReplication=False
bDynamicReplication=False
InvalidTagCharacters="\"\',"
+GameplayTagTableList=None
NumBitsForContainerSize=6
NetIndexFirstBitSegment=16

; 能量类型
+GameplayTagList=(Tag="Energy.Type.General",DevComment="通用能量")
+GameplayTagList=(Tag="Energy.Type.Ultimate",DevComment="终结技能量")
+GameplayTagList=(Tag="Energy.Type.Weapon",DevComment="武器能量")
+GameplayTagList=(Tag="Energy.Type.Monster",DevComment="怪物能量")

; 技能加成类型
+GameplayTagList=(Tag="Bonus.NormalAtk",DevComment="普攻加成")
+GameplayTagList=(Tag="Bonus.SpecialAtk",DevComment="技能加成")
+GameplayTagList=(Tag="Bonus.UltimateAtk",DevComment="终结技加成")
+GameplayTagList=(Tag="Bonus.SwitchAtk",DevComment="切换技加成")

; SetByCaller tags for Cost GE
+GameplayTagList=(Tag="SetByCaller.SkillID",DevComment="技能ID")
+GameplayTagList=(Tag="SetByCaller.SkillLevel",DevComment="技能等级")

; 冷却
+GameplayTagList=(Tag="Status.Cooldown",DevComment="技能冷却中")

; 配置系统（ConfigSubsystem）
+GameplayTagList=(Tag="Config.Attr.Hero.Init",DevComment="角色属性初始化配置")
+GameplayTagList=(Tag="Config.Attr.Monster.Init",DevComment="怪物属性初始化配置")
+GameplayTagList=(Tag="Config.Attr.Energy",DevComment="能量池配置")
+GameplayTagList=(Tag="Config.Attr.DamageBonus",DevComment="伤害加成配置")

; 角色状态 (C3 AN/ANS)
+GameplayTagList=(Tag="Status.Dodging",DevComment="闪避无敌帧")
+GameplayTagList=(Tag="Status.Parrying",DevComment="招架窗口")
+GameplayTagList=(Tag="Status.Recovery",DevComment="后摇恢复")
+GameplayTagList=(Tag="Status.MovementLocked",DevComment="技能动画中禁止移动")
+GameplayTagList=(Tag="Status.Animation.Playing",DevComment="技能Montage播放中")
+GameplayTagList=(Tag="Status.Animation.UpperBody",DevComment="上半身混合模式")

